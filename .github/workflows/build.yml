name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write    # 建 release 与上传 zip 需要写权限
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build jar
        run: mvn -B clean package

      - name: Upload jar (always)
        uses: actions/upload-artifact@v4
        with:
          name: CreativeBox-jar
          path: target/CreativeBox-1.0-SNAPSHOT.jar

      - name: Package release zip
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p dist/plugins
          cp target/CreativeBox-1.0-SNAPSHOT.jar dist/plugins/
          cp src/main/resources/config.yml dist/plugins/
          cp README.md dist/
          (cd dist && zip -r CreativeBox.zip plugins README.md)

      # 用 run number 区分资产名，避免同一 tag 重复推送时 409 冲突
      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        id: release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/CreativeBox.zip
          name: "CreativeBox ${{ github.ref_name }} (run ${{ github.run_number }})"

      - name: Re-upload zip under a unique name (retry-safe)
        if: startsWith(github.ref, 'refs/tags/v') && steps.release.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: CreativeBox-${{ github.ref_name }}-run${{ github.run_number }}
          path: dist/CreativeBox.zip
