# CreativeBox 配置
# 改完记得 /sb reload 生效。

world:
  name: sandbox
  environment: NORMAL      # NORMAL | NETHER | THE_END | CUSTOM
  type: FLAT               # FLAT | NORMAL | LARGE_BIOMES | AMPLIFIED
  seed: 0
  generate-structures: false
  generator-settings: ""   # 超平坦字符串，例如 "minecraft:bedrock,2*minecraft:dirt,minecraft:grass_block"
  # 进场前在出生点下方铺 5x5 基岩+石头，防止一进场就掉进虚空
  auto-build-platform: true

spawn:
  x: 0.5
  y: 65.0
  z: 0.5
  yaw: 0.0
  pitch: 0.0

# 键名用原版游戏规则名；未收录进 GameRule 常量的键（如 pvp）会自动走字符串接口
gamerules:
  doMobSpawning: false
  doDaylightCycle: false
  doWeatherCycle: false
  mobGriefing: false
  keepInventory: true
  pvp: false

world-border:
  enabled: false
  diameter: 500            # 边界直径（格），中心对准沙盒出生点

sandbox:
  game-mode: CREATIVE
  allow-flight: true
  flying: false

isolation:
  # true = 进入沙盒时清掉该状态，退出时恢复；false = 原样保留
  all: false               # true 时下面各项全部生效
  inventory: true
  ender-chest: true
  potion-effects: true
  experience: true
  health-and-food: true
  # 禁止沙盒与主世界之间的跨世界传送/传送门（插件自身的进出传送不受影响）
  block-cross-world-teleport: true

void-protection:
  enabled: true
  # 绝对高度阈值：玩家 Y 低于该值且继续往下掉时，拉回出生点（默认 50）
  threshold: 50

reset:
  enabled: false
  time: "04:00"            # 服务器本地时间，每天一次，删除并重建沙盒世界

messages:
  prefix: "&8[&b沙盒&8] "
  entered-sandbox: "&a已进入沙盒世界"
  exited-sandbox: "&a已退出沙盒，状态已恢复"
  already-in-sandbox: "&c你已经在沙盒里了"
  not-in-sandbox: "&c你不在沙盒里"
  world-not-ready: "&c沙盒世界不可用，请管理员执行 /sb reload"
  void-rescued: "&c你掉出了沙盒，已拉回出生点"
  teleport-blocked: "&c沙盒内不允许跨世界传送，用 /sb exit 退出"
  portal-blocked: "&c沙盒内不能通过传送门穿越世界"
